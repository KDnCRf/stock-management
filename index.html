<!DOCTYPE html>
<html lang="de" data-bs-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- WebApp & iOS Tags -->
  <meta name="apple-mobile-web-app-title" content="Vorrat">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://fav.farm/🍏">
  
  <title>Lebensmittelverwalter</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- HTML5-QRCode Scanner Bibliothek -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <script>
    const setScheme = () => {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-bs-theme', prefersDark ? 'dark' : 'light');
    };
    setScheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setScheme);
  </script>
</head>
<body class="p-3 p-md-4">

  <div class="container-md">
    <header class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <h1 class="h3 mb-0">🍏 Vorratsverwalter</h1>
      <div class="d-flex align-items-center gap-2">
        <span id="fileStatus" class="badge bg-secondary">Nicht verbunden</span>
        <button id="btnSettings" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#settingsModal">⚙️ Token</button>
        <button id="btnSave" class="btn btn-primary btn-sm" disabled>Speichern</button>
      </div>
    </header>

    <!-- Open Food Facts Suche & Barcode Scan -->
    <div class="card mb-3 border-info-subtle bg-info-subtle bg-opacity-10 position-relative">
      <div class="card-body py-2">
        <label class="form-label small fw-bold text-info-emphasis mb-1">🔍 Open Food Facts Suche / Barcode Scan</label>
        <div class="input-group input-group-sm">
          <input type="text" id="offSearchInput" class="form-control" placeholder="Barcode oder Produktname...">
          <button class="btn btn-outline-info" type="button" id="btnStartScan" data-bs-toggle="modal" data-bs-target="#scannerModal">📷 Scan</button>
          <button class="btn btn-info text-white" type="button" id="btnOffSearch">Suchen</button>
        </div>
        <div id="offSearchResults" class="list-group position-absolute w-100 shadow-sm mt-1" style="z-index: 1050; max-height: 200px; overflow-y: auto;"></div>
      </div>
    </div>

    <!-- Modal für Kamera-Kader -->
    <div class="modal fade" id="scannerModal" tabindex="-1" aria-labelledby="scannerModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header py-2">
            <h5 class="modal-title h6" id="scannerModalLabel">📷 Barcode scannen</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" id="btnCloseScanner" aria-label="Schließen"></button>
          </div>
          <div class="modal-body p-2 text-center">
            <div id="reader" style="width: 100%; min-height: 250px;" class="rounded overflow-hidden bg-black"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal für GitHub-Einstellungen -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header py-2">
            <h5 class="modal-title h6" id="settingsModalLabel">⚙️ GitHub Verbinden</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
          </div>
          <div class="modal-body">
            <form id="settingsForm">
              <div class="mb-2">
                <label class="form-label small mb-1">GitHub Benutzername</label>
                <input type="text" id="ghOwner" class="form-control form-control-sm" required placeholder="z. B. maxmustermann">
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">Repository Name</label>
                <input type="text" id="ghRepo" class="form-control form-control-sm" required placeholder="z. B. vorrat">
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">Dateiname im Repo</label>
                <input type="text" id="ghPath" class="form-control form-control-sm" value="vorrat.json" required>
              </div>
              <div class="mb-3">
                <label class="form-label small mb-1">Personal Access Token (PAT)</label>
                <input type="password" id="ghToken" class="form-control form-control-sm" required placeholder="github_pat_...">
              </div>
              <button type="submit" class="btn btn-primary btn-sm w-100">Verbindung Speichern</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Formular zum Hinzufügen -->
    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h6 mb-3">Neues Lebensmittel hinzufügen</h2>
        <form id="addItemForm" class="row g-2">
          <div class="col-md-4">
            <input type="text" id="itemName" class="form-control form-control-sm" placeholder="Artikel (z.B. Milch)" required>
          </div>
          <div class="col-md-3">
            <input type="number" id="itemQty" class="form-control form-control-sm" placeholder="Menge" value="1" min="1" required>
          </div>
          <div class="col-md-3">
            <select id="itemLocation" class="form-select form-select-sm" required>
              <option value="" disabled selected>Ablageort...</option>
              <option value="Kühlschrank">Kühlschrank</option>
              <option value="Gefrierschrank">Gefrierschrank</option>
              <option value="Vorratsschrank">Vorratsschrank</option>
              <option value="Keller">Keller</option>
              <option value="Sonstiges">Sonstiges</option>
            </select>
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-success btn-sm w-100">Hinzufügen</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabelle -->
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>Artikel</th>
            <th style="width: 120px;">Menge</th>
            <th>Ablageort</th>
            <th style="width: 80px;" class="text-end">Aktion</th>
          </tr>
        </thead>
        <tbody id="inventoryBody">
          <tr>
            <td colspan="4" class="text-center text-muted">Lade Daten von GitHub...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // --- DOM Elemente ---
    const btnSave = document.getElementById('btnSave');
    const fileStatus = document.getElementById('fileStatus');
    const form = document.getElementById('addItemForm');
    const tableBody = document.getElementById('inventoryBody');
    const settingsForm = document.getElementById('settingsForm');
    
    const offSearchInput = document.getElementById('offSearchInput');
    const btnOffSearch = document.getElementById('btnOffSearch');
    const offSearchResults = document.getElementById('offSearchResults');
    const scannerModal = document.getElementById('scannerModal');
    const settingsModal = new bootstrap.Modal(document.getElementById('settingsModal'));

    let html5QrCode = null;
    let inventory = [];
    let currentSha = null; // Wird von GitHub API zur Konfliktvermeidung benötigt

    // Helper: Base64 Utf8 Encoding/Decoding
    const utf8ToBase64 = (str) => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
    const base64ToUtf8 = (str) => new TextDecoder().decode(Uint8Array.from(atob(str), c => c.charCodeAt(0)));

    // --- GitHub Einstellungen laden/speichern ---
    function getGHConfig() {
      return {
        owner: localStorage.getItem('gh_owner') || '',
        repo: localStorage.getItem('gh_repo') || '',
        path: localStorage.getItem('gh_path') || 'vorrat.json',
        token: localStorage.getItem('gh_token') || ''
      };
    }

    function fillSettingsForm() {
      const cfg = getGHConfig();
      document.getElementById('ghOwner').value = cfg.owner;
      document.getElementById('ghRepo').value = cfg.repo;
      document.getElementById('ghPath').value = cfg.path;
      document.getElementById('ghToken').value = cfg.token;
    }

    settingsForm.addEventListener('submit', (e) => {
      e.preventDefault();
      localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_path', document.getElementById('ghPath').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      
      settingsModal.hide();
      loadFromGitHub();
    });

    // --- GitHub REST API Sync ---
    async function loadFromGitHub() {
      const cfg = getGHConfig();
      if (!cfg.owner || !cfg.repo || !cfg.token) {
        fileStatus.textContent = 'Token fehlt';
        fileStatus.className = 'badge bg-warning text-dark';
        tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Klicke oben auf "⚙️ Token", um GitHub zu verbinden.</td></tr>';
        settingsModal.show();
        return;
      }

      fileStatus.textContent = 'Lade...';
      fileStatus.className = 'badge bg-info';

      try {
        const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`, {
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (res.status === 404) {
          // Datei existiert im Repo noch nicht -> leere Liste anlegen
          inventory = [];
          currentSha = null;
          fileStatus.textContent = 'Neue Datei';
          fileStatus.className = 'badge bg-success';
          btnSave.disabled = false;
          renderTable();
          return;
        }

        if (!res.ok) throw new Error(`HTTP Fehler ${res.status}`);

        const data = await res.json();
        currentSha = data.sha;
        const jsonText = base64ToUtf8(data.content.replace(/\n/g, ''));
        inventory = JSON.parse(jsonText);

        fileStatus.textContent = 'Synchronisiert';
        fileStatus.className = 'badge bg-success';
        btnSave.disabled = false;
        renderTable();
      } catch (err) {
        fileStatus.textContent = 'Sync Fehler';
        fileStatus.className = 'badge bg-danger';
        tableBody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Fehler beim Laden: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    async function saveToGitHub() {
      const cfg = getGHConfig();
      if (!cfg.owner || !cfg.repo || !cfg.token) return;

      btnSave.disabled = true;
      btnSave.textContent = 'Speichert...';

      try {
        const jsonString = JSON.stringify(inventory, null, 2);
        const base64Content = utf8ToBase64(jsonString);

        const bodyData = {
          message: 'Vorrat aktualisiert (App Sync)',
          content: base64Content
        };
        if (currentSha) bodyData.sha = currentSha;

        const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(bodyData)
        });

        if (!res.ok) throw new Error(`HTTP Fehler ${res.status}`);

        const resData = await res.json();
        currentSha = resData.content.sha; // Neuen SHA-Hash für das nächste Speichern merken

        fileStatus.textContent = 'Gespeichert';
        fileStatus.className = 'badge bg-success';
        alert('Erfolgreich auf GitHub gespeichert!');
      } catch (err) {
        alert('Fehler beim Speichern: ' + err.message);
      } finally {
        btnSave.disabled = false;
        btnSave.textContent = 'Speichern';
      }
    }

    btnSave.addEventListener('click', saveToGitHub);

    // --- Barcode Scanner Logik ---
    scannerModal._element.addEventListener('shown.bs.modal', async () => {
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
      
      const config = { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          async (decodedText) => {
            await stopScanner();
            const modalInstance = bootstrap.Modal.getInstance(scannerModal._element);
            if (modalInstance) modalInstance.hide();

            offSearchInput.value = decodedText;
            searchOpenFoodFacts(decodedText);
          },
          () => {}
        );
      } catch (err) {
        alert("Kamera-Zugriff nicht möglich.");
        const modalInstance = bootstrap.Modal.getInstance(scannerModal._element);
        if (modalInstance) modalInstance.hide();
      }
    });

    async function stopScanner() {
      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {}
      }
    }

    scannerModal._element.addEventListener('hide.bs.modal', stopScanner);

    // --- Open Food Facts API ---
    async function searchOpenFoodFacts(query) {
      offSearchResults.innerHTML = '';
      if (!query.trim()) return;

      const isBarcode = /^\d+$/.test(query.trim());

      if (isBarcode) {
        try {
          const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${query.trim()}.json`);
          const data = await res.json();
          if (data.status === 1) {
            const pName = data.product.product_name_de || data.product.product_name || 'Unbekanntes Produkt';
            fillFormWithProduct(pName);
          } else {
            alert('Kein Produkt zu diesem Barcode gefunden.');
          }
        } catch (e) {
          alert('Fehler bei der Barcode-Abfrage.');
        }
      } else {
        try {
          const res = await fetch(`https://de.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=5`);
          const data = await res.json();
          
          if (data.products && data.products.length > 0) {
            data.products.forEach(p => {
              const name = p.product_name_de || p.product_name || 'Unbekannt';
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'list-group-item list-group-item-action py-1 small';
              btn.textContent = name;
              btn.onclick = () => {
                fillFormWithProduct(name);
                offSearchResults.innerHTML = '';
              };
              offSearchResults.appendChild(btn);
            });
          } else {
            offSearchResults.innerHTML = '<div class="list-group-item small text-muted">Keine Treffer gefunden.</div>';
          }
        } catch (e) {
          alert('Fehler bei der Suche.');
        }
      }
    }

    function fillFormWithProduct(name) {
      document.getElementById('itemName').value = name;
      offSearchInput.value = '';
      offSearchResults.innerHTML = '';
      document.getElementById('itemQty').focus();
    }

    btnOffSearch.addEventListener('click', () => searchOpenFoodFacts(offSearchInput.value));
    offSearchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchOpenFoodFacts(offSearchInput.value);
      }
    });

    document.addEventListener('click', (e) => {
      if (!offSearchInput.contains(e.target) && !offSearchResults.contains(e.target)) {
        offSearchResults.innerHTML = '';
      }
    });

    // --- Tabellen-Rendering ---
    function renderTable() {
      tableBody.innerHTML = '';
      if (inventory.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Der Vorrat ist aktuell leer.</td></tr>';
        return;
      }

      inventory.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${escapeHtml(item.name)}</strong></td>
          <td>
            <div class="input-group input-group-sm">
              <button class="btn btn-outline-secondary" onclick="updateQty(${index}, -1)">-</button>
              <span class="input-group-text px-3">${item.qty}</span>
              <button class="btn btn-outline-secondary" onclick="updateQty(${index}, 1)">+</button>
            </div>
          </td>
          <td><span class="badge bg-secondary-subtle text-secondary-emphasis">${escapeHtml(item.location)}</span></td>
          <td class="text-end">
            <button class="btn btn-outline-danger btn-sm" onclick="removeItem(${index})">&times;</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    window.updateQty = (index, delta) => {
      inventory[index].qty += delta;
      if (inventory[index].qty <= 0) inventory.splice(index, 1);
      renderTable();
    };

    window.removeItem = (index) => {
      inventory.splice(index, 1);
      renderTable();
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('itemName').value;
      const qty = parseInt(document.getElementById('itemQty').value);
      const location = document.getElementById('itemLocation').value;

      inventory.push({ name, qty, location });
      renderTable();
      form.reset();
    });

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    // Beim Start Einstellungen füllen & Daten von GitHub abrufen
    window.addEventListener('DOMContentLoaded', () => {
      fillSettingsForm();
      loadFromGitHub();
    });
  </script>
</body>
</html>
