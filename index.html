<!DOCTYPE html>
<html lang="de" data-bs-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- WebApp & iOS Tags -->
  <meta name="apple-mobile-web-app-title" content="Vorrat">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://fav.farm/🍏">
  
  <title>Lebensmittelverwalter</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- HTML5-QRCode Scanner Bibliothek -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <script>
    const setScheme = () => {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-bs-theme', prefersDark ? 'dark' : 'light');
    };
    setScheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setScheme);
  </script>
</head>
<body class="p-3 p-md-4">

  <div class="container-md">
    <!-- Header ohne Speichern-Button -->
    <header class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <h1 class="h3 mb-0">🍏 Vorratsverwalter</h1>
      <div class="d-flex align-items-center gap-2">
        <span id="fileStatus" class="badge bg-secondary p-2fs-6">Nicht verbunden</span>
        <button id="btnSettings" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#settingsModal">⚙️ Token</button>
      </div>
    </header>

    <!-- Modal für Kamera-Kader -->
    <div class="modal fade" id="scannerModal" tabindex="-1" aria-labelledby="scannerModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header py-2">
            <h5 class="modal-title h6" id="scannerModalLabel">📷 Barcode scannen</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" id="btnCloseScanner" aria-label="Schließen"></button>
          </div>
          <div class="modal-body p-2 text-center">
            <div id="reader" style="width: 100%; min-height: 250px;" class="rounded overflow-hidden bg-black"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal für GitHub-Einstellungen -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header py-2">
            <h5 class="modal-title h6" id="settingsModalLabel">⚙️ GitHub Verbinden</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
          </div>
          <div class="modal-body">
            <form id="settingsForm">
              <div class="mb-2">
                <label class="form-label small mb-1">GitHub Benutzername</label>
                <input type="text" id="ghOwner" class="form-control" required placeholder="z. B. maxmustermann">
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">Repository Name</label>
                <input type="text" id="ghRepo" class="form-control" required placeholder="z. B. vorrat">
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">Dateiname im Repo</label>
                <input type="text" id="ghPath" class="form-control" value="vorrat.json" required>
              </div>
              <div class="mb-3">
                <label class="form-label small mb-1">Personal Access Token (PAT)</label>
                <input type="password" id="ghToken" class="form-control" required placeholder="github_pat_...">
              </div>
              <button type="submit" class="btn btn-primary w-100">Verbindung Speichern</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Formular zum Hinzufügen (Touch-Optimiert mit vergrößerten Feldern) -->
    <div class="card mb-4 shadow-sm">
      <div class="card-body p-3 p-md-4">
        <h2 class="h6 mb-3">Neues Lebensmittel hinzufügen</h2>
        <form id="addItemForm" class="row g-3">
          <!-- Kombiniertes Artikel- / Barcode-Feld -->
          <div class="col-12 col-md-5 position-relative">
            <div class="input-group">
              <input type="text" id="itemName" class="form-control form-control-lg" placeholder="Artikel oder Barcode..." required autocomplete="off">
              <button class="btn btn-outline-info" type="button" id="btnStartScan" data-bs-toggle="modal" data-bs-target="#scannerModal" title="Barcode scannen">📷</button>
              <button class="btn btn-outline-secondary" type="button" id="btnOffSearch" title="In Datenbank suchen">🔍</button>
            </div>
            <div id="offSearchResults" class="list-group position-absolute w-100 shadow-sm mt-1" style="z-index: 1050; max-height: 200px; overflow-y: auto;"></div>
          </div>

          <div class="col-6 col-md-2">
            <input type="number" id="itemQty" class="form-control form-control-lg" placeholder="Menge" value="1" min="1" required>
          </div>

          <div class="col-6 col-md-2">
            <input type="date" id="itemMhd" class="form-control form-control-lg" title="Mindesthaltbarkeitsdatum">
          </div>

          <div class="col-12 col-md-3">
            <select id="itemLocation" class="form-select form-select-lg" required>
              <option value="" disabled selected>Ablageort...</option>
              <option value="Kühlschrank">Kühlschrank</option>
              <option value="Gefrierschrank">Gefrierschrank</option>
              <option value="Vorratsschrank">Vorratsschrank</option>
              <option value="Keller">Keller</option>
              <option value="Sonstiges">Sonstiges</option>
            </select>
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-success btn-lg w-100">Hinzufügen</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Suchfeld für Vorratsliste -->
    <div class="mb-3">
      <div class="input-group input-group-lg">
        <span class="input-group-text bg-body-tertiary">🔍</span>
        <input type="text" id="filterInput" class="form-control" placeholder="Vorräte durchsuchen (Name oder Ort)...">
        <button class="btn btn-outline-secondary" type="button" id="btnClearFilter" title="Filter zurücksetzen">&times;</button>
      </div>
    </div>

    <!-- Tabelle -->
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>Artikel</th>
            <th style="width: 140px;">Menge</th>
            <th>MHD</th>
            <th>Ablageort</th>
            <th style="width: 60px;" class="text-end">Aktion</th>
          </tr>
        </thead>
        <tbody id="inventoryBody">
          <tr>
            <td colspan="5" class="text-center text-muted py-4">Lade Daten von GitHub...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // --- DOM Elemente ---
    const fileStatus = document.getElementById('fileStatus');
    const form = document.getElementById('addItemForm');
    const tableBody = document.getElementById('inventoryBody');
    const settingsForm = document.getElementById('settingsForm');
    
    const itemNameInput = document.getElementById('itemName');
    const btnOffSearch = document.getElementById('btnOffSearch');
    const offSearchResults = document.getElementById('offSearchResults');
    const scannerModal = document.getElementById('scannerModal');
    const settingsModal = new bootstrap.Modal(document.getElementById('settingsModal'));

    const filterInput = document.getElementById('filterInput');
    const btnClearFilter = document.getElementById('btnClearFilter');

    let html5QrCode = null;
    let inventory = [];
    let currentSha = null;
    let autoSaveTimer = null;

    // Helper: Base64 Utf8 Encoding/Decoding
    const utf8ToBase64 = (str) => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
    const base64ToUtf8 = (str) => new TextDecoder().decode(Uint8Array.from(atob(str), c => c.charCodeAt(0)));

    // --- GitHub Einstellungen ---
    function getGHConfig() {
      return {
        owner: localStorage.getItem('gh_owner') || '',
        repo: localStorage.getItem('gh_repo') || '',
        path: localStorage.getItem('gh_path') || 'vorrat.json',
        token: localStorage.getItem('gh_token') || ''
      };
    }

    function fillSettingsForm() {
      const cfg = getGHConfig();
      document.getElementById('ghOwner').value = cfg.owner;
      document.getElementById('ghRepo').value = cfg.repo;
      document.getElementById('ghPath').value = cfg.path;
      document.getElementById('ghToken').value = cfg.token;
    }

    settingsForm.addEventListener('submit', (e) => {
      e.preventDefault();
      localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_path', document.getElementById('ghPath').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      
      settingsModal.hide();
      loadFromGitHub();
    });

    // --- Auto-Save Logik ---
    function triggerAutoSave() {
      fileStatus.textContent = 'Ungespeichert...';
      fileStatus.className = 'badge bg-warning text-dark p-2 fs-6';
      
      clearTimeout(autoSaveTimer);

      autoSaveTimer = setTimeout(() => {
        saveToGitHub();
      }, 1500);
    }

    // --- GitHub REST API Sync ---
    async function loadFromGitHub() {
      const cfg = getGHConfig();
      if (!cfg.owner || !cfg.repo || !cfg.token) {
        fileStatus.textContent = 'Token fehlt';
        fileStatus.className = 'badge bg-warning text-dark p-2 fs-6';
        tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Klicke oben auf "⚙️ Token", um GitHub zu verbinden.</td></tr>';
        settingsModal.show();
        return;
      }

      fileStatus.textContent = 'Lade...';
      fileStatus.className = 'badge bg-info p-2 fs-6';

      try {
        const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`, {
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (res.status === 404) {
          inventory = [];
          currentSha = null;
          fileStatus.textContent = 'Bereit';
          fileStatus.className = 'badge bg-success p-2 fs-6';
          renderTable();
          return;
        }

        if (!res.ok) throw new Error(`HTTP Fehler ${res.status}`);

        const data = await res.json();
        currentSha = data.sha;
        const jsonText = base64ToUtf8(data.content.replace(/\n/g, ''));
        inventory = JSON.parse(jsonText);

        fileStatus.textContent = 'Synchronisiert';
        fileStatus.className = 'badge bg-success p-2 fs-6';
        renderTable();
      } catch (err) {
        fileStatus.textContent = 'Sync Fehler';
        fileStatus.className = 'badge bg-danger p-2 fs-6';
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Fehler beim Laden: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    async function saveToGitHub() {
      const cfg = getGHConfig();
      if (!cfg.owner || !cfg.repo || !cfg.token) return;

      fileStatus.textContent = 'Speichert...';
      fileStatus.className = 'badge bg-info p-2 fs-6';

      try {
        const jsonString = JSON.stringify(inventory, null, 2);
        const base64Content = utf8ToBase64(jsonString);

        const bodyData = {
          message: 'Vorrat aktualisiert (Auto-Save)',
          content: base64Content
        };
        if (currentSha) bodyData.sha = currentSha;

        const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(bodyData)
        });

        if (!res.ok) throw new Error(`HTTP Fehler ${res.status}`);

        const resData = await res.json();
        currentSha = resData.content.sha;

        fileStatus.textContent = 'Gespeichert';
        fileStatus.className = 'badge bg-success p-2 fs-6';
      } catch (err) {
        fileStatus.textContent = 'Speicherfehler';
        fileStatus.className = 'badge bg-danger p-2 fs-6';
      }
    }

    // --- Barcode Scanner Logik ---
    scannerModal.addEventListener('shown.bs.modal', async () => {
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
      
      const config = { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          async (decodedText) => {
            await stopScanner();
            const modalInstance = bootstrap.Modal.getInstance(scannerModal);
            if (modalInstance) modalInstance.hide();

            itemNameInput.value = decodedText;
            searchOpenFoodFacts(decodedText);
          },
          () => {}
        );
      } catch (err) {
        alert("Kamera-Zugriff nicht möglich.");
        const modalInstance = bootstrap.Modal.getInstance(scannerModal);
        if (modalInstance) modalInstance.hide();
      }
    });

    async function stopScanner() {
      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {}
      }
    }

    scannerModal.addEventListener('hide.bs.modal', stopScanner);

    // --- Open Food Facts API (Kombinierte Suche im Artikel-Feld) ---
    async function searchOpenFoodFacts(query) {
      offSearchResults.innerHTML = '';
      if (!query.trim()) return;

      const isBarcode = /^\d+$/.test(query.trim());

      if (isBarcode) {
        try {
          const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${query.trim()}.json`);
          const data = await res.json();
          if (data.status === 1) {
            const pName = data.product.product_name_de || data.product.product_name || 'Unbekanntes Produkt';
            fillFormWithProduct(pName);
          } else {
            alert('Kein Produkt zu diesem Barcode gefunden.');
          }
        } catch (e) {
          alert('Fehler bei der Barcode-Abfrage.');
        }
      } else {
        try {
          const res = await fetch(`https://de.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=5`);
          const data = await res.json();
          
          if (data.products && data.products.length > 0) {
            data.products.forEach(p => {
              const name = p.product_name_de || p.product_name || 'Unbekannt';
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'list-group-item list-group-item-action py-2 small';
              btn.textContent = name;
              btn.onclick = () => {
                fillFormWithProduct(name);
                offSearchResults.innerHTML = '';
              };
              offSearchResults.appendChild(btn);
            });
          } else {
            offSearchResults.innerHTML = '<div class="list-group-item small text-muted">Keine Treffer gefunden.</div>';
          }
        } catch (e) {
          alert('Fehler bei der Suche.');
        }
      }
    }

    function fillFormWithProduct(name) {
      itemNameInput.value = name;
      offSearchResults.innerHTML = '';
      document.getElementById('itemQty').focus();
    }

    btnOffSearch.addEventListener('click', () => searchOpenFoodFacts(itemNameInput.value));
    
    itemNameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const val = itemNameInput.value.trim();
        if (/^\d+$/.test(val)) {
          e.preventDefault();
          searchOpenFoodFacts(val);
        }
      }
    });

    document.addEventListener('click', (e) => {
      if (!itemNameInput.contains(e.target) && !offSearchResults.contains(e.target)) {
        offSearchResults.innerHTML = '';
      }
    });

    // --- Formatierung & Farblogik für MHD ---
    function getMhdBadge(mhdStr) {
      if (!mhdStr) return '<span class="text-muted small">-</span>';

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const mhdDate = new Date(mhdStr);
      mhdDate.setHours(0, 0, 0, 0);

      const diffTime = mhdDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      // Deutsches Datumsformat (DD.MM.YYYY)
      const formattedDate = mhdDate.toLocaleDateString('de-DE', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });

      if (diffDays < 0) {
        return `<span class="badge bg-danger text-white" title="Abgelaufen">${formattedDate}</span>`;
      } else if (diffDays <= 7) {
        return `<span class="badge bg-warning text-dark" title="Ablauf nahe">${formattedDate}</span>`;
      } else {
        return `<span class="badge bg-success-subtle text-success-emphasis" title="Haltbar">${formattedDate}</span>`;
      }
    }

    // --- Tabellen-Rendering & Filter-Logik ---
    function renderTable() {
      tableBody.innerHTML = '';
      if (inventory.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Der Vorrat ist aktuell leer.</td></tr>';
        return;
      }

      const query = filterInput.value.toLowerCase().trim();

      const filteredItems = inventory
        .map((item, originalIndex) => ({ ...item, originalIndex }))
        .filter(item => 
          item.name.toLowerCase().includes(query) || 
          item.location.toLowerCase().includes(query)
        );

      if (filteredItems.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Keine passenden Artikel gefunden.</td></tr>';
        return;
      }

      filteredItems.forEach((item) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${escapeHtml(item.name)}</strong></td>
          <td>
            <div class="input-group input-group-sm" style="max-width: 120px;">
              <button class="btn btn-outline-secondary px-2" onclick="updateQty(${item.originalIndex}, -1)">-</button>
              <span class="input-group-text px-2 flex-grow-1 justify-content-center fw-bold">${item.qty}</span>
              <button class="btn btn-outline-secondary px-2" onclick="updateQty(${item.originalIndex}, 1)">+</button>
            </div>
          </td>
          <td>${getMhdBadge(item.mhd)}</td>
          <td><span class="badge bg-secondary-subtle text-secondary-emphasis">${escapeHtml(item.location)}</span></td>
          <td class="text-end">
            <button class="btn btn-outline-danger btn-sm" onclick="removeItem(${item.originalIndex})" title="Löschen">&times;</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    filterInput.addEventListener('input', renderTable);
    btnClearFilter.addEventListener('click', () => {
      filterInput.value = '';
      renderTable();
    });

    window.updateQty = (index, delta) => {
      inventory[index].qty += delta;
      if (inventory[index].qty <= 0) inventory.splice(index, 1);
      renderTable();
      triggerAutoSave();
    };

    window.removeItem = (index) => {
      inventory.splice(index, 1);
      renderTable();
      triggerAutoSave();
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = itemNameInput.value.trim();
      const qty = parseInt(document.getElementById('itemQty').value);
      const mhd = document.getElementById('itemMhd').value;
      const location = document.getElementById('itemLocation').value;

      inventory.push({ name, qty, mhd, location });
      renderTable();
      form.reset();
      triggerAutoSave();
    });

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    // Beim Start Einstellungen füllen & Daten abrufen
    window.addEventListener('DOMContentLoaded', () => {
      fillSettingsForm();
      loadFromGitHub();
    });
  </script>
</body>
</html>
