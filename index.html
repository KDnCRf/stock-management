<!DOCTYPE html>
<html lang="de" data-bs-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- WebApp & iOS Tags -->
  <meta name="apple-mobile-web-app-title" content="Vorrat">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://fav.farm/🍏">
  
  <title>Lebensmittelverwalter</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- HTML5-QRCode Scanner Bibliothek -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <script>
    const setScheme = () => {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-bs-theme', prefersDark ? 'dark' : 'light');
    };
    setScheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setScheme);
  </script>

  <style>
    .inventory-card {
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }
    .inventory-card:hover {
      border-color: var(--bs-border-color-translucent);
    }
    .product-img {
        width: auto;
        height: 68px;
    }
    .save-indicator {
      font-size: 1.25rem;
      transition: color 0.3s ease;
    }
  </style>
</head>
<body class="p-2 p-sm-3 p-md-4 bg-body-tertiary">

  <div class="container-md max-width-lg">
    <!-- Header -->
    <header class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <h1 class="h3 mb-0 fw-bold d-flex align-items-center gap-2">
        <i class="bi bi-basket2-fill text-success"></i> Vorrat
      </h1>
      <div class="d-flex align-items-center gap-3">
        <!-- Statusanzeige Disketten-Icon -->
        <div id="saveStatus" class="d-flex align-items-center gap-1 text-secondary" title="Status: Initialisieren...">
          <i id="saveIcon" class="bi bi-floppy-fill save-indicator text-secondary"></i>
        </div>
        <button id="btnSettings" class="btn btn-outline-secondary btn-sm rounded-circle p-2 d-flex align-items-center justify-content-center" style="width:38px; height:38px;" data-bs-toggle="modal" data-bs-target="#settingsModal" title="Einstellungen">
          <i class="bi bi-gear-fill"></i>
        </button>
      </div>
    </header>

    <!-- Modal für Barcode Scanner -->
    <div class="modal fade" id="scannerModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title h6 fw-bold"><i class="bi bi-qr-code-scan me-2"></i>Barcode scannen</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" id="btnCloseScanner" aria-label="Schließen"></button>
          </div>
          <div class="modal-body p-3 text-center">
            <div id="reader" style="width: 100%; min-height: 250px;" class="rounded-3 overflow-hidden bg-black"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal für GitHub-Einstellungen -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title h6 fw-bold"><i class="bi bi-github me-2"></i>GitHub Verbinden</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
          </div>
          <div class="modal-body p-3">
            <form id="settingsForm">
              <div class="mb-2">
                <label class="form-label small mb-1 fw-medium">GitHub Benutzername</label>
                <input type="text" id="ghOwner" class="form-control rounded-3" required placeholder="z. B. maxmustermann">
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1 fw-medium">Repository Name</label>
                <input type="text" id="ghRepo" class="form-control rounded-3" required placeholder="z. B. vorrat">
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1 fw-medium">Dateiname im Repo</label>
                <input type="text" id="ghPath" class="form-control rounded-3" value="vorrat.json" required>
              </div>
              <div class="mb-3">
                <label class="form-label small mb-1 fw-medium">Personal Access Token (PAT)</label>
                <input type="password" id="ghToken" class="form-control rounded-3" required placeholder="github_pat_...">
              </div>
              <button type="submit" class="btn btn-primary rounded-3 w-100 fw-medium">Verbindung Speichern</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal zum Bearbeiten / Löschen eines Artikels -->
    <div class="modal fade" id="editItemModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title h6 fw-bold"><i class="bi bi-pencil-square me-2"></i>Artikel bearbeiten</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
          </div>
          <div class="modal-body p-3">
            <form id="editItemForm">
              <input type="hidden" id="editIndex">
              
              <div class="mb-3">
                <label class="form-label small mb-1 fw-medium">Artikelname</label>
                <input type="text" id="editName" class="form-control rounded-3" required>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label class="form-label small mb-1 fw-medium">Menge</label>
                  <input type="number" id="editQty" class="form-control rounded-3" min="1" required>
                </div>
                <div class="col-6">
                  <label class="form-label small mb-1 fw-medium">MHD</label>
                  <input type="date" id="editMhd" class="form-control rounded-3">
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label class="form-label small mb-1 fw-medium">Ablageort</label>
                  <select id="editLocation" class="form-select rounded-3" required>
                    <option value="Kühlschrank">Kühlschrank</option>
                    <option value="Gefrierschrank">Gefrierschrank</option>
                    <option value="Vorratsschrank">Vorratsschrank</option>
                    <option value="Keller">Keller</option>
                    <option value="Sonstiges">Sonstiges</option>
                  </select>
                </div>
                <div class="col-6">
                  <label class="form-label small mb-1 fw-medium">Zustand</label>
                  <select id="editStatus" class="form-select rounded-3" required>
                    <option value="verpackt">Original verpackt</option>
                    <option value="angebrochen">Angebrochen</option>
                  </select>
                </div>
              </div>

              <div class="d-flex gap-2 pt-2 border-top">
                <button type="button" class="btn btn-outline-danger rounded-3" id="btnDeleteFromModal">
                  <i class="bi bi-trash me-1"></i> Löschen
                </button>
                <button type="submit" class="btn btn-primary rounded-3 flex-grow-1">
                  <i class="bi bi-check-lg me-1"></i> Speichern
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Formular zum Hinzufügen -->
    <div class="card mb-4 border-0 shadow-sm rounded-4">
      <div class="card-body p-3 p-md-4">
        <h2 class="h6 fw-bold mb-3"><i class="bi bi-plus-circle me-1"></i> Neues Lebensmittel hinzufügen</h2>
        <form id="addItemForm" class="row g-2 g-md-3">
          <!-- Artikel / Barcode -->
          <div class="col-12 col-md-4 position-relative">
            <div class="input-group">
              <input type="text" id="itemName" class="form-control form-control-lg rounded-start-3" placeholder="Artikel oder Barcode..." required autocomplete="off">
              <button class="btn btn-outline-secondary border-end-0" type="button" id="btnStartScan" data-bs-toggle="modal" data-bs-target="#scannerModal" title="Barcode scannen">
                <i class="bi bi-camera"></i>
              </button>
              <button class="btn btn-outline-secondary rounded-end-3" type="button" id="btnOffSearch" title="In Datenbank suchen">
                <i class="bi bi-search"></i>
              </button>
            </div>
            <div id="offSearchResults" class="list-group position-absolute w-100 shadow mt-1 rounded-3" style="z-index: 1050; max-height: 220px; overflow-y: auto;"></div>
          </div>

          <div class="col-4 col-md-2">
            <input type="number" id="itemQty" class="form-control form-control-lg rounded-3" placeholder="Menge" value="1" min="1" required>
          </div>

          <div class="col-8 col-md-2">
            <input type="date" id="itemMhd" class="form-control form-control-lg rounded-3" title="Mindesthaltbarkeitsdatum">
          </div>

          <div class="col-6 col-md-2">
            <select id="itemLocation" class="form-select form-select-lg rounded-3" required>
              <option value="" disabled selected>Ort...</option>
              <option value="Kühlschrank">Kühlschrank</option>
              <option value="Gefrierschrank">Gefrierschrank</option>
              <option value="Vorratsschrank">Vorratsschrank</option>
              <option value="Keller">Keller</option>
              <option value="Sonstiges">Sonstiges</option>
            </select>
          </div>

          <div class="col-6 col-md-2">
            <select id="itemStatus" class="form-select form-select-lg rounded-3" required>
              <option value="verpackt" selected>Verpackt</option>
              <option value="angebrochen">Angebrochen</option>
            </select>
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-success btn-lg rounded-3 w-100 fw-medium">
              <i class="bi bi-plus-lg me-1"></i> Hinzufügen
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Suchfeld für Vorratsliste -->
    <div class="mb-3">
      <div class="input-group input-group-lg shadow-sm rounded-4 overflow-hidden">
        <span class="input-group-text bg-body border-0 ps-3"><i class="bi bi-search text-secondary"></i></span>
        <input type="text" id="filterInput" class="form-control border-0 bg-body shadow-none" placeholder="Vorräte durchsuchen...">
        <button class="btn btn-link text-body-tertiary text-decoration-none border-0 bg-body pe-3" type="button" id="btnClearFilter" title="Filter zurücksetzen">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <!-- Dynamische Vorratsliste -->
    <div id="inventoryContainer" class="d-flex flex-column gap-2 mb-5">
      <div class="card border-0 shadow-sm rounded-4 text-center py-5 text-muted">
        Lade Daten von GitHub...
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // --- DOM Elemente ---
    const saveIcon = document.getElementById('saveIcon');
    const saveStatus = document.getElementById('saveStatus');
    const form = document.getElementById('addItemForm');
    const inventoryContainer = document.getElementById('inventoryContainer');
    const settingsForm = document.getElementById('settingsForm');
    
    const itemNameInput = document.getElementById('itemName');
    const btnOffSearch = document.getElementById('btnOffSearch');
    const offSearchResults = document.getElementById('offSearchResults');
    const scannerModal = document.getElementById('scannerModal');
    const settingsModal = new bootstrap.Modal(document.getElementById('settingsModal'));
    const editItemModal = new bootstrap.Modal(document.getElementById('editItemModal'));

    const filterInput = document.getElementById('filterInput');
    const btnClearFilter = document.getElementById('btnClearFilter');

    let html5QrCode = null;
    let inventory = [];
    let currentSha = null;
    let autoSaveTimer = null;
    let selectedImageUrl = '';

    // Helper: Base64 Utf8 Encoding/Decoding
    const utf8ToBase64 = (str) => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
    const base64ToUtf8 = (str) => new TextDecoder().decode(Uint8Array.from(atob(str), c => c.charCodeAt(0)));

    // --- GitHub Einstellungen ---
    function getGHConfig() {
      return {
        owner: localStorage.getItem('gh_owner') || '',
        repo: localStorage.getItem('gh_repo') || '',
        path: localStorage.getItem('gh_path') || 'vorrat.json',
        token: localStorage.getItem('gh_token') || ''
      };
    }

    function fillSettingsForm() {
      const cfg = getGHConfig();
      document.getElementById('ghOwner').value = cfg.owner;
      document.getElementById('ghRepo').value = cfg.repo;
      document.getElementById('ghPath').value = cfg.path;
      document.getElementById('ghToken').value = cfg.token;
    }

    settingsForm.addEventListener('submit', (e) => {
      e.preventDefault();
      localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_path', document.getElementById('ghPath').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      
      settingsModal.hide();
      loadFromGitHub();
    });

    // --- Status-Anzeige Aktualisierung ---
    function setSaveState(state, tooltip) {
      saveStatus.title = tooltip;
      if (state === 'saved') {
        saveIcon.className = 'bi bi-floppy-fill save-indicator text-success';
      } else if (state === 'saving' || state === 'unsaved') {
        saveIcon.className = 'bi bi-floppy save-indicator text-warning';
      } else if (state === 'error') {
        saveIcon.className = 'bi bi-floppy-fill save-indicator text-danger';
      }
    }

    // --- Auto-Save Logik ---
    function triggerAutoSave() {
      setSaveState('unsaved', 'Ungespeicherte Änderungen...');
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        saveToGitHub();
      }, 1500);
    }

    // --- GitHub REST API Sync ---
    async function loadFromGitHub() {
      const cfg = getGHConfig();
      if (!cfg.owner || !cfg.repo || !cfg.token) {
        setSaveState('error', 'Token fehlt!');
        inventoryContainer.innerHTML = '<div class="card border-0 shadow-sm rounded-4 text-center py-5 text-muted">Klicke oben auf <i class="bi bi-gear-fill"></i>, um GitHub zu verbinden.</div>';
        settingsModal.show();
        return;
      }

      setSaveState('saving', 'Lade Daten...');

      try {
        const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`, {
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (res.status === 404) {
          inventory = [];
          currentSha = null;
          setSaveState('saved', 'Bereit (Neues Repo)');
          renderTable();
          return;
        }

        if (!res.ok) throw new Error(`HTTP Fehler ${res.status}`);

        const data = await res.json();
        currentSha = data.sha;
        const jsonText = base64ToUtf8(data.content.replace(/\n/g, ''));
        inventory = JSON.parse(jsonText);

        setSaveState('saved', 'Synchronisiert');
        renderTable();
      } catch (err) {
        setSaveState('error', `Fehler: ${err.message}`);
        inventoryContainer.innerHTML = `<div class="card border-0 shadow-sm rounded-4 text-center py-5 text-danger">Fehler beim Laden: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function saveToGitHub() {
      const cfg = getGHConfig();
      if (!cfg.owner || !cfg.repo || !cfg.token) return;

      setSaveState('saving', 'Speichert...');

      try {
        const jsonString = JSON.stringify(inventory, null, 2);
        const base64Content = utf8ToBase64(jsonString);

        const bodyData = {
          message: 'Vorrat aktualisiert (Auto-Save)',
          content: base64Content
        };
        if (currentSha) bodyData.sha = currentSha;

        const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(bodyData)
        });

        if (!res.ok) throw new Error(`HTTP Fehler ${res.status}`);

        const resData = await res.json();
        currentSha = resData.content.sha;

        setSaveState('saved', 'Erfolgreich gespeichert');
      } catch (err) {
        setSaveState('error', 'Speicherfehler!');
      }
    }

    // --- Barcode Scanner Logik ---
    scannerModal.addEventListener('shown.bs.modal', async () => {
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
      
      const config = { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          async (decodedText) => {
            await stopScanner();
            const modalInstance = bootstrap.Modal.getInstance(scannerModal);
            if (modalInstance) modalInstance.hide();

            itemNameInput.value = decodedText;
            searchOpenFoodFacts(decodedText);
          },
          () => {}
        );
      } catch (err) {
        alert("Kamera-Zugriff nicht möglich.");
        const modalInstance = bootstrap.Modal.getInstance(scannerModal);
        if (modalInstance) modalInstance.hide();
      }
    });

    async function stopScanner() {
      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {}
      }
    }

    scannerModal.addEventListener('hide.bs.modal', stopScanner);

    // --- Open Food Facts API ---
    async function searchOpenFoodFacts(query) {
      offSearchResults.innerHTML = '';
      if (!query.trim()) return;

      const isBarcode = /^\d+$/.test(query.trim());

      if (isBarcode) {
        try {
          const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${query.trim()}.json`);
          const data = await res.json();
          if (data.status === 1) {
            const pName = data.product.product_name_de || data.product.product_name || 'Unbekanntes Produkt';
            const imgUrl = data.product.image_front_small_url || data.product.image_small_url || data.product.image_url || '';
            fillFormWithProduct(pName, imgUrl);
          } else {
            alert('Kein Produkt zu diesem Barcode gefunden.');
          }
        } catch (e) {
          alert('Fehler bei der Barcode-Abfrage.');
        }
      } else {
        try {
          const res = await fetch(`https://de.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=5`);
          const data = await res.json();
          
          if (data.products && data.products.length > 0) {
            data.products.forEach(p => {
              const name = p.product_name_de || p.product_name || 'Unbekannt';
              const imgUrl = p.image_front_small_url || p.image_small_url || p.image_url || '';
              
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'list-group-item list-group-item-action py-2 small d-flex align-items-center gap-2';
              
              const imgTag = imgUrl 
                ? `<img src="${escapeHtml(imgUrl)}" class="rounded flex-shrink-0" style="width: 32px; height: 32px; object-fit: cover;">`
                : `<div class="rounded bg-body-tertiary flex-shrink-0 d-flex align-items-center justify-content-center text-secondary" style="width: 32px; height: 32px;"><i class="bi bi-box-seam"></i></div>`;

              btn.innerHTML = `
                ${imgTag}
                <span class="fw-medium text-break">${escapeHtml(name)}</span>
              `;
              btn.onclick = () => {
                fillFormWithProduct(name, imgUrl);
                offSearchResults.innerHTML = '';
              };
              offSearchResults.appendChild(btn);
            });
          } else {
            offSearchResults.innerHTML = '<div class="list-group-item small text-muted">Keine Treffer gefunden.</div>';
          }
        } catch (e) {
          alert('Fehler bei der Suche.');
        }
      }
    }

    function fillFormWithProduct(name, imageUrl = '') {
      itemNameInput.value = name;
      selectedImageUrl = imageUrl;
      offSearchResults.innerHTML = '';
      document.getElementById('itemQty').focus();
    }

    btnOffSearch.addEventListener('click', () => searchOpenFoodFacts(itemNameInput.value));
    
    itemNameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const val = itemNameInput.value.trim();
        if (/^\d+$/.test(val)) {
          e.preventDefault();
          searchOpenFoodFacts(val);
        }
      }
    });

    document.addEventListener('click', (e) => {
      if (!itemNameInput.contains(e.target) && !offSearchResults.contains(e.target)) {
        offSearchResults.innerHTML = '';
      }
    });

    // --- MHD Badges ---
    function getMhdBadge(mhdStr) {
      if (!mhdStr) return '<span class="text-body-tertiary small">Kein MHD</span>';

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const mhdDate = new Date(mhdStr);
      mhdDate.setHours(0, 0, 0, 0);

      const diffTime = mhdDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      const formattedDate = mhdDate.toLocaleDateString('de-DE', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });

      if (diffDays < 0) {
        return `<span class="badge rounded-pill bg-danger-subtle text-danger border border-danger-subtle px-2 py-1" title="Abgelaufen"><i class="bi bi-exclamation-triangle-fill me-1"></i>${formattedDate}</span>`;
      } else if (diffDays <= 7) {
        return `<span class="badge rounded-pill bg-warning-subtle text-warning-emphasis border border-warning-subtle px-2 py-1" title="Ablauf nahe"><i class="bi bi-hourglass-split me-1"></i>${formattedDate}</span>`;
      } else {
        return `<span class="badge rounded-pill bg-success-subtle text-success-emphasis border border-success-subtle px-2 py-1" title="Haltbar"><i class="bi bi-check-circle me-1"></i>${formattedDate}</span>`;
      }
    }

    // --- Status Badges (Verpackt / Angebrochen) ---
    function getStatusBadge(status) {
      if (status === 'angebrochen') {
        return `<span class="badge rounded-pill bg-info-subtle text-info-emphasis border border-info-subtle px-2 py-1"><i class="bi bi-box-seam-fill me-1"></i>Angebrochen</span>`;
      }
      return `<span class="badge rounded-pill bg-secondary-subtle text-secondary border border-secondary-subtle px-2 py-1"><i class="bi bi-box-seam me-1"></i>Verpackt</span>`;
    }

    // --- Responsive Rendering ---
    function renderTable() {
      inventoryContainer.innerHTML = '';

      if (inventory.length === 0) {
        inventoryContainer.innerHTML = '<div class="card border-0 shadow-sm rounded-4 text-center py-5 text-muted">Der Vorrat ist aktuell leer.</div>';
        return;
      }

      const query = filterInput.value.toLowerCase().trim();

      const filteredItems = inventory
        .map((item, originalIndex) => ({ ...item, originalIndex }))
        .filter(item => 
          item.name.toLowerCase().includes(query) || 
          item.location.toLowerCase().includes(query)
        );

      if (filteredItems.length === 0) {
        inventoryContainer.innerHTML = '<div class="card border-0 shadow-sm rounded-4 text-center py-5 text-muted">Keine passenden Artikel gefunden.</div>';
        return;
      }

      filteredItems.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'card inventory-card border-0 shadow-sm rounded-4 p-3 bg-body';

        const imageElement = item.image 
          ? `<img src="${escapeHtml(item.image)}" alt="" class="rounded-3 product-img flex-shrink-0 border">`
          : `<div class="rounded-3 bg-body-tertiary d-flex align-items-center justify-content-center flex-shrink-0 border product-img text-secondary fs-4"><i class="bi bi-box-seam p-2"></i></div>`;

        card.innerHTML = `
          <div class="d-flex align-items-center justify-content-between gap-3">
            <!-- Bild & Details -->
            <div class="d-flex align-items-center gap-3 overflow-hidden flex-grow-1">
              ${imageElement}
              <div class="overflow-hidden flex-grow-1">
                <!-- Menge in weiß vor dem mehrzeiligen Produktnamen -->
                <div class="d-flex align-items-start gap-2 mb-1">
                  <span class="badge bg-dark text-white rounded-pill px-2 py-1 flex-shrink-0 mt-1">${item.qty}x</span>
                  <span class="fw-bold text-body fs-6 text-break">
                    ${escapeHtml(item.name)}
                  </span>
                </div>
                <div class="d-flex flex-wrap align-items-center gap-1 gap-md-2">
                  ${getMhdBadge(item.mhd)}
                  <span class="badge rounded-pill bg-body-secondary text-body-tertiary border px-2 py-1">${escapeHtml(item.location)}</span>
                  ${getStatusBadge(item.status)}
                </div>
              </div>
            </div>

            <!-- Menü Icon Button -->
            <button class="btn btn-outline-secondary btn-sm rounded-circle p-2 flex-shrink-0 d-flex align-items-center justify-content-center" 
                    style="width: 38px; height: 38px;" 
                    onclick="openEditModal(${item.originalIndex})" 
                    title="Optionen">
              <i class="bi bi-three-dots-vertical fs-6"></i>
            </button>
          </div>
        `;
        inventoryContainer.appendChild(card);
      });
    }

    // --- Modal Bearbeiten Logik ---
    window.openEditModal = (index) => {
      const item = inventory[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('editName').value = item.name;
      document.getElementById('editQty').value = item.qty;
      document.getElementById('editMhd').value = item.mhd || '';
      document.getElementById('editLocation').value = item.location;
      document.getElementById('editStatus').value = item.status || 'verpackt';

      editItemModal.show();
    };

    document.getElementById('editItemForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const index = parseInt(document.getElementById('editIndex').value);
      
      inventory[index].name = document.getElementById('editName').value.trim();
      inventory[index].qty = parseInt(document.getElementById('editQty').value);
      inventory[index].mhd = document.getElementById('editMhd').value;
      inventory[index].location = document.getElementById('editLocation').value;
      inventory[index].status = document.getElementById('editStatus').value;

      editItemModal.hide();
      renderTable();
      triggerAutoSave();
    });

    document.getElementById('btnDeleteFromModal').addEventListener('click', () => {
      const index = parseInt(document.getElementById('editIndex').value);
      if (confirm('Möchtest du diesen Artikel wirklich löschen?')) {
        inventory.splice(index, 1);
        editItemModal.hide();
        renderTable();
        triggerAutoSave();
      }
    });

    // --- Filter & Hinzufügen ---
    filterInput.addEventListener('input', renderTable);
    btnClearFilter.addEventListener('click', () => {
      filterInput.value = '';
      renderTable();
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = itemNameInput.value.trim();
      const qty = parseInt(document.getElementById('itemQty').value);
      const mhd = document.getElementById('itemMhd').value;
      const location = document.getElementById('itemLocation').value;
      const status = document.getElementById('itemStatus').value;

      inventory.push({ 
        name, 
        qty, 
        mhd, 
        location, 
        status,
        image: selectedImageUrl 
      });

      selectedImageUrl = '';
      renderTable();
      form.reset();
      document.getElementById('itemQty').value = 1;
      triggerAutoSave();
    });

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    // Start
    window.addEventListener('DOMContentLoaded', () => {
      fillSettingsForm();
      loadFromGitHub();
    });
  </script>
</body>
</html>
