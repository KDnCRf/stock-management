<!DOCTYPE html>
<html lang="de" data-bs-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- App-Titel auf dem Home-Bildschirm -->
<meta name="apple-mobile-web-app-title" content="Vorrat">

<!-- Aktiviert den Vollbildmodus (versteckt Safari-Steuerung) -->
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Farbe der Statusleiste oben (default, black, oder black-translucent) -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- App-Icon für iOS (optional: durch deinen eigenen Bild-Link ersetzen) -->
<link rel="apple-touch-icon" href="https://fav.farm/🍏">
  
  <title>Lebensmittelverwalter</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- HTML5-QRCode Scanner Bibliothek -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <script>
    const setScheme = () => {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-bs-theme', prefersDark ? 'dark' : 'light');
    };
    setScheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setScheme);
  </script>
</head>
<body class="p-3 p-md-4">

  <div class="container-md">
    <header class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <h1 class="h3 mb-0">🍏 Vorratsverwalter</h1>
      <div class="d-flex align-items-center gap-2">
        <span id="fileStatus" class="badge bg-secondary">Keine Datei verknüpft</span>
        <button id="btnSelectFile" class="btn btn-outline-primary btn-sm">CSV Auswählen</button>
        <button id="btnSave" class="btn btn-primary btn-sm" disabled>Speichern</button>
      </div>
    </header>

    <!-- Open Food Facts Suche & Barcode Scan -->
<div class="card mb-3 border-info-subtle bg-info-subtle bg-opacity-10">
  <div class="card-body py-2">
    <label class="form-label small fw-bold text-info-emphasis mb-1">🔍 Open Food Facts Suche / Barcode Scan</label>
    <div class="input-group input-group-sm">
      <input type="text" id="offSearchInput" class="form-control" placeholder="Barcode oder Produktname...">
      <button class="btn btn-outline-info" type="button" id="btnStartScan" data-bs-toggle="modal" data-bs-target="#scannerModal">📷 Scan</button>
      <button class="btn btn-info text-white" type="button" id="btnOffSearch">Suchen</button>
    </div>
    <div id="offSearchResults" class="list-group position-absolute w-100 shadow-sm mt-1" style="z-index: 1000; max-height: 200px; overflow-y: auto;"></div>
  </div>
</div>

<!-- Modal für Kamera-Kader -->
<div class="modal fade" id="scannerModal" tabindex="-1" aria-labelledby="scannerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h5 class="modal-title h6" id="scannerModalLabel">📷 Barcode scannen</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" id="btnCloseScanner" aria-label="Schließen"></button>
      </div>
      <div class="modal-body p-2 text-center">
        <!-- Kamera-Vorschau -->
        <div id="reader" style="width: 100%; min-height: 250px;" class="rounded overflow-hidden"></div>
      </div>
    </div>
  </div>
</div>

    <!-- Formular zum Hinzufügen -->
    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h6 mb-3">Neues Lebensmittel hinzufügen</h2>
        <form id="addItemForm" class="row g-2">
          <div class="col-md-4">
            <input type="text" id="itemName" class="form-control form-control-sm" placeholder="Artikel (z.B. Milch)" required>
          </div>
          <div class="col-md-3">
            <input type="number" id="itemQty" class="form-control form-control-sm" placeholder="Menge" value="1" min="1" required>
          </div>
          <div class="col-md-3">
            <select id="itemLocation" class="form-select form-select-sm" required>
              <option value="" disabled selected>Ablageort...</option>
              <option value="Kühlschrank">Kühlschrank</option>
              <option value="Gefrierschrank">Gefrierschrank</option>
              <option value="Vorratsschrank">Vorratsschrank</option>
              <option value="Keller">Keller</option>
              <option value="Sonstiges">Sonstiges</option>
            </select>
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-success btn-sm w-100">Hinzufügen</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabelle -->
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>Artikel</th>
            <th style="width: 120px;">Menge</th>
            <th>Ablageort</th>
            <th style="width: 80px;" class="text-end">Aktion</th>
          </tr>
        </thead>
        <tbody id="inventoryBody">
          <tr>
            <td colspan="4" class="text-center text-muted">Lade Daten...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
let html5QrCode = null;

const scannerModal = document.getElementById('scannerModal');

// Startet die Kamera beim Öffnen des Modals
scannerModal.addEventListener('shown.bs.modal', async () => {
  html5QrCode = new Html5Qrcode("reader");
  
  const config = {
    fps: 10,
    qrbox: { width: 250, height: 150 }, // Rechteckig, ideal für Strichcodes
    aspectRatio: 1.0
  };

  try {
    // Startet bevorzugt die Rückkamera (environment)
    await html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        // Erfolgreich gescannt
        stopScanner();
        
        // Modal schließen
        const modalInstance = bootstrap.Modal.getInstance(scannerModal);
        if (modalInstance) modalInstance.hide();

        // Barcode eintragen & Suche auslösen
        offSearchInput.value = decodedText;
        searchOpenFoodFacts(decodedText);
      },
      (errorMessage) => {
        // Einzelne fehlgeschlagene Frames ignorieren
      }
    );
  } catch (err) {
    alert("Kamera-Zugriff nicht möglich. Bitte Berechtigung in iOS prüfen.");
    const modalInstance = bootstrap.Modal.getInstance(scannerModal);
    if (modalInstance) modalInstance.hide();
  }
});

// Stoppt die Kamera beim Schließen des Modals
async function stopScanner() {
  if (html5QrCode && html5QrCode.isScanning) {
    await html5QrCode.stop();
    html5QrCode.clear();
  }
}

scannerModal.addEventListener('hide.bs.modal', stopScanner);



    
    let fileHandle = null;
    let inventory = [];

    const btnSelectFile = document.getElementById('btnSelectFile');
    const btnSave = document.getElementById('btnSave');
    const fileStatus = document.getElementById('fileStatus');
    const form = document.getElementById('addItemForm');
    const tableBody = document.getElementById('inventoryBody');
    
    const offSearchInput = document.getElementById('offSearchInput');
    const btnOffSearch = document.getElementById('btnOffSearch');
    const offSearchResults = document.getElementById('offSearchResults');

    // --- IndexedDB ---
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("FoodStorageDB", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("handles");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveFileHandle(handle) {
      const db = await openDB();
      const tx = db.transaction("handles", "readwrite");
      tx.objectStore("handles").put(handle, "csvFile");
    }

    async function getStoredFileHandle() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction("handles", "readonly");
        const req = tx.objectStore("handles").get("csvFile");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    // --- Open Food Facts API ---
    async function searchOpenFoodFacts(query) {
      offSearchResults.innerHTML = '';
      if (!query.trim()) return;

      const isBarcode = /^\d+$/.test(query.trim());

      if (isBarcode) {
        // Direkte Barcode-Abfrage
        try {
          const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${query.trim()}.json`);
          const data = await res.json();
          if (data.status === 1) {
            const pName = data.product.product_name_de || data.product.product_name || 'Unbekanntes Produkt';
            fillFormWithProduct(pName);
          } else {
            alert('Kein Produkt zu diesem Barcode gefunden.');
          }
        } catch (e) {
          alert('Fehler bei der Barcode-Abfrage.');
        }
      } else {
        // Text-Suche
        try {
          const res = await fetch(`https://de.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=5`);
          const data = await res.json();
          
          if (data.products && data.products.length > 0) {
            data.products.forEach(p => {
              const name = p.product_name_de || p.product_name || 'Unbekannt';
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'list-group-item list-group-item-action py-1 small';
              btn.textContent = name;
              btn.onclick = () => {
                fillFormWithProduct(name);
                offSearchResults.innerHTML = '';
              };
              offSearchResults.appendChild(btn);
            });
          } else {
            offSearchResults.innerHTML = '<div class="list-group-item small text-muted">Keine Treffer gefunden.</div>';
          }
        } catch (e) {
          alert('Fehler bei der Suche.');
        }
      }
    }

    function fillFormWithProduct(name) {
      document.getElementById('itemName').value = name;
      offSearchInput.value = '';
      offSearchResults.innerHTML = '';
      document.getElementById('itemQty').focus();
    }

    btnOffSearch.addEventListener('click', () => searchOpenFoodFacts(offSearchInput.value));
    offSearchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchOpenFoodFacts(offSearchInput.value);
      }
    });

    // Klick außerhalb schließt Suchergebnisse
    document.addEventListener('click', (e) => {
      if (!offSearchInput.contains(e.target) && !offSearchResults.contains(e.target)) {
        offSearchResults.innerHTML = '';
      }
    });

    // --- CSV Logik ---
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      if (lines.length <= 1) return [];
      
      return lines.slice(1).filter(l => l.trim()).map(line => {
        const [name, qty, location] = line.split(';').map(s => s.trim());
        return { name, qty: parseInt(qty) || 1, location: location || 'Sonstiges' };
      });
    }

    function generateCSV(data) {
      const header = 'Artikel;Menge;Ablageort\r\n';
      const rows = data.map(item => `${item.name};${item.qty};${item.location}`).join('\r\n');
      return header + rows;
    }

    function renderTable() {
      tableBody.innerHTML = '';
      if (inventory.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Die Liste ist leer.</td></tr>';
        return;
      }

      inventory.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${escapeHtml(item.name)}</strong></td>
          <td>
            <div class="input-group input-group-sm">
              <button class="btn btn-outline-secondary" onclick="updateQty(${index}, -1)">-</button>
              <span class="input-group-text px-3">${item.qty}</span>
              <button class="btn btn-outline-secondary" onclick="updateQty(${index}, 1)">+</button>
            </div>
          </td>
          <td><span class="badge bg-secondary-subtle text-secondary-emphasis">${escapeHtml(item.location)}</span></td>
          <td class="text-end">
            <button class="btn btn-outline-danger btn-sm" onclick="removeItem(${index})">&times;</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    window.updateQty = (index, delta) => {
      inventory[index].qty += delta;
      if (inventory[index].qty <= 0) inventory.splice(index, 1);
      renderTable();
    };

    window.removeItem = (index) => {
      inventory.splice(index, 1);
      renderTable();
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('itemName').value;
      const qty = parseInt(document.getElementById('itemQty').value);
      const location = document.getElementById('itemLocation').value;

      inventory.push({ name, qty, location });
      renderTable();
      form.reset();
    });

    // --- Datei Handling ---
    async function loadFileFromHandle(handle) {
      try {
        const options = { mode: 'readwrite' };
        if ((await handle.queryPermission(options)) !== 'granted') {
          if ((await handle.requestPermission(options)) !== 'granted') return false;
        }

        const file = await handle.getFile();
        const text = await file.text();
        inventory = parseCSV(text);
        fileHandle = handle;
        
        fileStatus.textContent = file.name;
        fileStatus.className = 'badge bg-success';
        btnSave.disabled = false;
        renderTable();
        return true;
      } catch (e) {
        return false;
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const savedHandle = await getStoredFileHandle();
      if (savedHandle) {
        const success = await loadFileFromHandle(savedHandle);
        if (!success) {
          tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Klicke auf "CSV Auswählen", um die Datei erneut zu verknüpfen.</td></tr>';
        }
      } else {
        tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Keine Datei verknüpft. Bitte einmalig eine CSV auswählen.</td></tr>';
      }
    });

    btnSelectFile.addEventListener('click', async () => {
      try {
        const [handle] = await window.showOpenFilePicker({
          types: [{ description: 'CSV Dateien', accept: { 'text/csv': ['.csv'] } }],
          multiple: false
        });
        
        if (await loadFileFromHandle(handle)) {
          await saveFileHandle(handle);
        }
      } catch (err) {
        if (err.name !== 'AbortError') alert('Fehler beim Auswählen der Datei.');
      }
    });

    btnSave.addEventListener('click', async () => {
      if (!fileHandle) return;
      try {
        const writable = await fileHandle.createWritable();
        await writable.write(generateCSV(inventory));
        await writable.close();
        alert('Erfolgreich gespeichert!');
      } catch (err) {
        alert('Fehler beim Speichern.');
      }
    });

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
  </script>
</body>
</html>
